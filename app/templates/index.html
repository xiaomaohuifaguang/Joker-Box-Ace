{% extends "layouts/base.html" %}

{% block content %}
<div class="card bg-base-100 shadow-xl max-w-md">
    <div class="card-body">
        <h2 class="card-title">{{ message }}</h2>
        <p>FastAPI + Jinja2 + daisyUI，静态资源全本地化，内网可跑。</p>
        <div class="card-actions justify-end">
            <button class="btn btn-primary" onclick="checkAlive()">调用 /alive</button>
        </div>
        <p id="alive-result" class="text-sm text-base-content/60 mt-2"></p>
    </div>
</div>

<script>
async function checkAlive() {
    const el = document.getElementById('alive-result');
    const d = await (await fetch('/alive')).json();
    el.textContent = `code=${d.code} msg=${d.msg}`;
}
</script>
{% endblock %}
